name: Feature request
description: Propose a new capability or enhancement.
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: "Describe the user problem first, then the solution. Alternatives help reviewers."
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user pain or missing capability motivates this?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work from the user's perspective?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed and why you rejected them.
  - type: dropdown
    id: phase
    attributes:
      label: Target phase
      options:
        - P0 (foundation)
        - P1 (WhatsApp pairing)
        - P2 (summaries + drafts)
        - P3 (reply-on-behalf)
        - later
        - not sure
