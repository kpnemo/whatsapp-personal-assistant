name: licenses

on:
  pull_request:
    paths:
      - "**/package.json"
      - pnpm-lock.yaml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: license allow-list
        run: |
          npx --yes license-checker-rseidelsohn --production \
            --onlyAllow "MIT;Apache-2.0;ISC;BSD-2-Clause;BSD-3-Clause;CC0-1.0;0BSD;Unlicense;WTFPL;Python-2.0" \
            --excludePackages "whatsapp-personal-assistant"
