name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wpa/db exec prisma generate

  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wpa/db exec prisma generate
      # Build internal packages whose test files (linted here via TS project
      # service) import `@wpa/test-utils` — without a built dist/index.d.ts
      # TS-ESLint resolves those imports as `unknown` and every member access
      # cascades into an `@typescript-eslint/no-unsafe-*` error.
      - run: pnpm --filter @wpa/shared --filter @wpa/db --filter @wpa/test-utils build
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wpa/db exec prisma generate
      - run: pnpm typecheck

  test:
    needs: setup
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: wpa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/wpa_test
      REDIS_URL: redis://localhost:6379/1
      JWT_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      MASTER_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
      PUBLIC_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wpa/db exec prisma generate
      # Pre-build internal packages that export dist/index.js so workspace
      # consumers (tests) can resolve them. @wpa/test-utils is imported by
      # @wpa/db's schema.test.ts at runtime — without a built dist it fails
      # with "Failed to resolve entry for package @wpa/test-utils".
      - run: pnpm --filter @wpa/shared --filter @wpa/db --filter @wpa/test-utils build
      - run: pnpm --filter @wpa/db exec prisma migrate deploy
      - run: pnpm -r test -- --coverage

  test-shell:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/wpa/_test/run.sh

  build:
    needs: [lint, typecheck, test, test-shell]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wpa/db exec prisma generate
      - run: pnpm build

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/smoke-test.sh

  test-e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wpa/db exec prisma generate
      - run: pnpm --filter @wpa/web exec playwright install --with-deps chromium
      # Base docker-compose.yml has `env_file: .env` on the app service.
      # The e2e override points app's env_file at .env.e2e (written by
      # global-setup.ts), but compose still validates the base .env exists
      # when merging the two files. Create an empty stub in CI.
      - run: touch .env
      - run: pnpm --filter @wpa/web test:e2e
        env:
          E2E_PORT: "3100"
          CI: "1"
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7
