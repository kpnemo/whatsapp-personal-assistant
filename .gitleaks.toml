title = "wpa gitleaks"

[extend]
useDefault = true

[[rules]]
id = "wpa-master-key"
description = "WPA MASTER_KEY"
regex = '''MASTER_KEY\s*=\s*['"]?[A-Za-z0-9+/=_-]{40,}['"]?'''
tags = ["secret", "wpa"]

[[rules]]
id = "wpa-jwt-secret"
description = "WPA JWT_SECRET"
regex = '''JWT_SECRET\s*=\s*['"]?[A-Za-z0-9+/=_-]{32,}['"]?'''
tags = ["secret", "wpa"]

# Historical false-positive: e2e test fixture password retired in a later
# commit. The "secret" was a hardcoded placeholder ("e2e-pass-12345678")
# used only in a throwaway testcontainer Postgres spun up for Playwright
# runs — never connected to any real service. Replaced with randomBytes(18)
# generated per-run in global-setup.ts, exported via process.env.
[allowlist]
description = "retired E2E fixture passwords"
commits = [
  "e5dbe44671a739b7e0cba7fd596754e3e891cb79",
]
